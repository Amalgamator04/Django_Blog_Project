{% extends 'core/base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Create New Post</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Create Post</button>
    </form>
    <p><a href="{% url 'profile' %}">Back to Profile</a></p>
</div>
{% endblock %}
