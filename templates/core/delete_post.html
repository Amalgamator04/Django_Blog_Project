{% extends 'core/base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Delete Post</h2>
    <p>Are you sure you want to delete <strong>{{ post.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button">Yes, delete</button>
        <a class="button button-secondary" href="{% url 'profile' %}">Cancel</a>
    </form>
</div>
{% endblock %}
